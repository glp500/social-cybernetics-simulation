name: social-cybernetics
channels:
  - conda-forge
platforms:
  - linux-64
dependencies:
  - python=3.12
  - pip

  # Current runtime and the committed research roadmap
  - numpy
  - pydantic>=2.10,<3
  - pyyaml>=6,<7
  - typer>=0.16,<1
  - pandas
  - scipy
  - pyarrow
  - xarray
  - netcdf4
  - matplotlib
  - seaborn
  - plotly
  - altair
  - networkx
  - scikit-learn
  - statsmodels
  - salib

  # Notebook workflow
  - jupyterlab
  - notebook
  - ipykernel
  - jupytext
  - nbformat
  - nbclient

  # Code quality
  - pytest
  - pytest-cov
  - hypothesis
  - ruff
  - pyright
  - pre-commit
  - debugpy

  # CLI / experiment helpers
  - rich
  - tqdm
  - visidata

  - pip:
      - "mesa[rec]==3.5.1"
